name: Build and Release GemSuite

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v1.0.0

permissions:
  contents: write

jobs:
  build:
    name: Build and Release Windows x64
    runs-on: windows-latest

    steps:
      # 1️⃣ Checkout source repo
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      # 3️⃣ Install dependencies
      - name: Install Dependencies
        run: npm install

      # 4️⃣ Build Electron app
      - name: Build Electron App
        run: node scripts/dist.js
        env:
          NODE_ENV: production

      # 5️⃣ Get version and app name
      - name: Get Version
        id: get_version
        shell: pwsh
        run: |
          $package = Get-Content ./apps/desktop/package.json | ConvertFrom-Json
          Write-Host "VERSION=$($package.version)" >> $env:GITHUB_OUTPUT
          Write-Host "APP_NAME=GemSuite" >> $env:GITHUB_OUTPUT

      # 6️⃣ Upload artifact to separate repo (Repo B)
      - name: Upload Release to Binary Repo
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}  # MUST be GH_TOKEN for gh CLI
        run: |
          $appName = "${{ steps.get_version.outputs.APP_NAME }}"
          $version = "${{ steps.get_version.outputs.VERSION }}"
          $artifactPath = "apps/desktop/release/$appName-$version-x64.exe"
          $repo = "akash-srivastava-pvt/Apps"  # Repo B

          if (-Not (Test-Path $artifactPath)) {
            Write-Error "
