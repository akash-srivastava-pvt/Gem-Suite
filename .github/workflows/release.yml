name: Build, Sign & Publish GemSuite Installer

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
# ------------------------------------------------------------
# 1️⃣ BUILD WINDOWS INSTALLER (UNSIGNED)
# ------------------------------------------------------------
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest

    outputs:
      version: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build production installer
        run: node scripts/dist.js
        env:
          NODE_ENV: production

      - name: Read app version
        id: meta
        shell: bash
        run: |
          VERSION=$(node -p "require('./apps/desktop/package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload unsigned installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: gemsuite-installer-unsigned
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/latest.yml

# ------------------------------------------------------------
# 2️⃣ CODE SIGN WINDOWS INSTALLER
# ------------------------------------------------------------
  sign-windows:
    name: Code Sign Windows Installer
    runs-on: windows-latest
    needs: build-windows

    outputs:
      version: ${{ needs.build-windows.outputs.version }}

    steps:
      - name: Download unsigned installer
        uses: actions/download-artifact@v4
        with:
          name: gemsuite-installer-unsigned
          path: unsigned

      - name: Restore code signing certificate
        shell: powershell
        run: |
          $bytes = [Convert]::FromBase64String("${{ secrets.CODESIGN_PFX_BASE64 }}")
          [IO.File]::WriteAllBytes("codesign.pfx", $bytes)

      - name: Locate signtool.exe
        shell: powershell
        run: |
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" `
            -Recurse -Filter signtool.exe |
            Sort-Object FullName -Descending |
            Select-Object -First 1

          if (-not $signtool) {
            throw "signtool.exe not found"
          }

          echo "SIGNTOOL=$($signtool.FullName)" >> $env:GITHUB_ENV

      - name: Sign EXE
        shell: powershell
        run: |
          $exe = Get-ChildItem unsigned -Recurse -Filter *.exe | Select-Object -First 1
          if (-not $exe) { throw "No EXE found" }

          & "$env:SIGNTOOL" sign `
            /f codesign.pfx `
            /p "${{ secrets.CODESIGN_PASSWORD }}" `
            /fd SHA256 `
            /tr http://timestamp.digicert.com `
            /td SHA256 `
            $exe.FullName

      - name: Verify signature
        shell: powershell
        run: |
          $exe = Get-ChildItem unsigned -Recurse -Filter *.exe | Select-Object -First 1
          $sig = Get-AuthenticodeSignature $exe.FullName
          if ($sig.Status -eq "NotSigned") {
            throw "EXE is NOT signed"
          }

      - name: Upload signed installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: gemsuite-installer-signed
          path: unsigned

# ------------------------------------------------------------
# 3️⃣ PUBLISH TO GITHUB RELEASE (CORRECT WAY)
# ------------------------------------------------------------
  publish-github-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: sign-windows

    steps:
      - name: Download signed installer
        uses: actions/download-artifact@v4
        with:
          name: gemsuite-installer-signed
          path: release-assets

      - name: Create GitHub Release & upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.sign-windows.outputs.version }}
          name: GemSuite v${{ needs.sign-windows.outputs.version }}
          body: |
            🚀 **GemSuite v${{ needs.sign-windows.outputs.version }}**

            - Windows installer (code-signed)
            - Auto-update metadata included
            - SHA256 signing & timestamped

            Download and install safely.
          files: |
            release-assets/**/*.exe
            release-assets/**/*.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
