name: Build, Sign & Publish GemSuite Installer

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
# ------------------------------------------------------------
# 1️⃣ BUILD WINDOWS INSTALLER (UNSIGNED) in Repo A
# ------------------------------------------------------------
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest

    outputs:
      version: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout source (Repo A)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Must produce a real installer (NSIS / Inno / MSI)
      - name: Build production installer
        run: node scripts/dist.js
        env:
          NODE_ENV: production

      - name: Read app version
        id: meta
        shell: bash
        run: |
          VERSION=$(node -p "require('./apps/desktop/package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Validate installer exists
        shell: powershell
        run: |
          $exe = Get-ChildItem apps/desktop/release -Filter *.exe
          if (-not $exe) { throw "Installer EXE not found" }

      - name: Upload unsigned installer
        uses: actions/upload-artifact@v4
        with:
          name: gemsuite-installer-unsigned
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/latest.yml

# ------------------------------------------------------------
# 2️⃣ SIGN WINDOWS INSTALLER
# ------------------------------------------------------------
  sign-windows:
    name: Code Sign Installer
    runs-on: windows-latest
    needs: build-windows

    outputs:
      version: ${{ needs.build-windows.outputs.version }}

    steps:
      - name: Download unsigned installer
        uses: actions/download-artifact@v4
        with:
          name: gemsuite-installer-unsigned
          path: unsigned

      - name: Restore code signing certificate
        shell: powershell
        run: |
          $bytes = [Convert]::FromBase64String("${{ secrets.CODESIGN_PFX_BASE64 }}")
          [IO.File]::WriteAllBytes("codesign.pfx", $bytes)

      - name: Locate signtool.exe
        shell: powershell
        run: |
          $tool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" `
            -Recurse -Filter signtool.exe |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $tool) { throw "signtool.exe not found" }
          echo "SIGNTOOL=$($tool.FullName)" >> $env:GITHUB_ENV

      - name: Sign EXE
        shell: powershell
        run: |
          $exe = Get-ChildItem unsigned -Recurse -Filter *.exe | Select-Object -First 1
          if (-not $exe) { throw "EXE not found" }

          & "$env:SIGNTOOL" sign `
            /f codesign.pfx `
            /p "${{ secrets.CODESIGN_PASSWORD }}" `
            /fd SHA256 `
            /tr http://timestamp.digicert.com `
            /td SHA256 `
            $exe.FullName

      - name: Verify signature
        shell: powershell
        run: |
          $exe = Get-ChildItem unsigned -Recurse -Filter *.exe | Select-Object -First 1
          $sig = Get-AuthenticodeSignature $exe.FullName
          $sig | Format-List
          if ($sig.Status -eq "NotSigned") { throw "EXE is NOT signed" }

      - name: Upload signed installer
        uses: actions/upload-artifact@v4
        with:
          name: gemsuite-installer-signed
          path: unsigned

# ------------------------------------------------------------
# 3️⃣ PUBLISH TO Repo B → GitHub Release + Pages
# ------------------------------------------------------------
  publish-release:
    name: Publish EXE to Repo B
    runs-on: ubuntu-latest
    needs: sign-windows

    steps:
      - name: Checkout Repo B (Apps)
        uses: actions/checkout@v4
        with:
          repository: akash-srivastava-pvt/Apps
          token: ${{ secrets.RELEASE_PAT }}
          path: repo-b
          fetch-depth: 0

      - name: Download signed installer
        uses: actions/download-artifact@v4
        with:
          name: gemsuite-installer-signed
          path: release-assets

      # ------------------------------------------------------
      # 3.1 Create GitHub Release in Repo B (Store-safe)
      # ------------------------------------------------------
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.sign-windows.outputs.version }}
          name: GemSuite v${{ needs.sign-windows.outputs.version }}
          draft: false
          prerelease: false
          files: |
            release-assets/**/*.exe
            release-assets/**/*.yml
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}

      # ------------------------------------------------------
      # 3.2 Update GitHub Pages for download landing
      # ------------------------------------------------------
      - name: Prepare Pages folder
        run: |
          mkdir -p repo-b/pages/GemSuite/${{ needs.sign-windows.outputs.version }}
          cp release-assets/**/*.exe repo-b/pages/GemSuite/${{ needs.sign-windows.outputs.version }}/
          cp release-assets/**/*.yml repo-b/pages/GemSuite/${{ needs.sign-windows.outputs.version }}/

      - name: Commit and push Pages update
        run: |
          cd repo-b
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pages/GemSuite/${{ needs.sign-windows.outputs.version }}
          git commit -m "Update Pages: GemSuite v${{ needs.sign-windows.outputs.version }}" || echo "No changes"
          git push origin main

      # ------------------------------------------------------
      # 3.3 Output Store-safe URL
      # ------------------------------------------------------
      - name: Output URLs
        run: |
          VERSION=${{ needs.sign-windows.outputs.version }}
          echo "--------------------------------------------------"
          echo "Store-safe Installer URL:"
          echo "https://github.com/akash-srivastava-pvt/Apps/releases/download/v$VERSION/GemSuite.Setup.$VERSION.exe"
          echo ""
          echo "Pages download URL:"
          echo "https://akash-srivastava-pvt.github.io/Apps/pages/GemSuite/$VERSION/GemSuite.Setup.$VERSION.exe"
          echo "--------------------------------------------------"
