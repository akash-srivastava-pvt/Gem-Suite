name: Build & Publish GemSuite Installer

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
# ------------------------------------------------------------
# 1️⃣ BUILD WINDOWS INSTALLER
# ------------------------------------------------------------
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest

    outputs:
      version: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build production installer
        run: node scripts/dist.js
        env:
          NODE_ENV: production

      - name: Read app version
        id: meta
        shell: bash
        run: |
          VERSION=$(node -p "require('./apps/desktop/package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: gemsuite-installer
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/latest.yml

# ------------------------------------------------------------
# 2️⃣ PUBLISH TO REPO B (GitHub Pages)
# ------------------------------------------------------------
  publish-pages:
    name: Publish Installer to Repo B Pages
    runs-on: ubuntu-latest
    needs: build-windows

    steps:
      - name: Checkout Repo B (Apps)
        uses: actions/checkout@v4
        with:
          repository: akash-srivastava-pvt/Apps
          token: ${{ secrets.RELEASE_PAT }}
          path: repo-b

      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: gemsuite-installer
          path: site/GemSuite/${{ needs.build-windows.outputs.version }}

      - name: Configure git identity
        run: |
          cd repo-b
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create or switch gh-pages branch
        run: |
          cd repo-b
          if git show-ref --quiet refs/heads/gh-pages; then
            git checkout gh-pages
          else
            git checkout --orphan gh-pages
            git rm -rf .
          fi

      - name: Copy installer files
        run: |
          cd repo-b
          mkdir -p GemSuite/${{ needs.build-windows.outputs.version }}
          cp -r ../../site/GemSuite/${{ needs.build-windows.outputs.version }}/* GemSuite/${{ needs.build-windows.outputs.version }}/

      - name: Commit & push
        run: |
          cd repo-b
          git add GemSuite
          git commit -m "Release v${{ needs.build-windows.outputs.version }}" || echo "No changes to commit"
          git push origin gh-pages --force

      - name: Output download URL
        run: |
          VERSION=${{ needs.build-windows.outputs.version }}
          echo "--------------------------------------------------"
          echo "Direct installer URL (NO redirect):"
          echo "https://akash-srivastava-pvt.github.io/Apps/GemSuite/${VERSION}/GemSuite%20Setup%20${VERSION}.exe"
          echo "--------------------------------------------------"
