name: Build & Publish GemSuite Installer

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write  # required for checkout/push

jobs:
# ------------------------------------------------------------
# 1️⃣ BUILD WINDOWS INSTALLER
# ------------------------------------------------------------
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest

    outputs:
      version: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build production installer
        run: node scripts/dist.js
        env:
          NODE_ENV: production

      - name: Read app version
        id: meta
        shell: bash
        run: |
          VERSION=$(node -p "require('./apps/desktop/package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: gemsuite-installer
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/latest.yml

# ------------------------------------------------------------
# 2️⃣ PUBLISH TO REPO B (GitHub Pages)
# ------------------------------------------------------------
  publish-pages:
    name: Publish Installer to Repo B Pages
    runs-on: ubuntu-latest
    needs: build-windows

    steps:
      - name: Checkout Repo B (Apps)
        uses: actions/checkout@v4
        with:
          repository: akash-srivastava-pvt/Apps
          token: ${{ secrets.RELEASE_PAT }}
          ref: gh-pages
          path: repo-b

      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: gemsuite-installer
          path: site/GemSuite/${{ needs.build-windows.outputs.version }}

      - name: Copy installer to Repo B
        run: |
          mkdir -p repo-b/GemSuite/${{ needs.build-windows.outputs.version }}
          cp -r site/GemSuite/${{ needs.build-windows.outputs.version }}/* repo-b/GemSuite/${{ needs.build-windows.outputs.version }}/

      - name: Configure git
        run: |
          cd repo-b
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit & push to gh-pages
        run: |
          cd repo-b
          git add GemSuite
          git commit -m "Release v${{ needs.build-windows.outputs.version }}" || echo "No changes to commit"
          git push origin gh-pages --force

      - name: Output direct download URL
        run: |
          VERSION=${{ needs.build-windows.outputs.version }}
          echo "--------------------------------------------------"
          echo "Direct installer URL (NO redirect):"
          echo "https://akash-srivastava-pvt.github.io/Apps/GemSuite/${VERSION}/GemSuite%20Setup%20${VERSION}.exe"
          echo "--------------------------------------------------"
