name: Build and Release GemSuite (Store Ready)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build Windows EXE and Upload to Azure
    runs-on: windows-latest

    steps:
      # 1️⃣ Checkout
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2️⃣ Node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"

      # 3️⃣ Install deps
      - name: Install dependencies
        run: npm install

      # 4️⃣ Build (your production script)
      - name: Build Electron App
        run: node scripts/dist.js
        env:
          NODE_ENV: production

      # 5️⃣ Extract version + artifact path
      - name: Resolve build metadata
        id: meta
        shell: bash
        run: |
          VERSION=$(node -p "require('./apps/desktop/package.json').version")
          APP_NAME="GemSuite"
          EXE_NAME="GemSuite Setup $VERSION.exe"
          EXE_PATH="apps/desktop/release/$EXE_NAME"

          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "APP_NAME=$APP_NAME" >> $GITHUB_OUTPUT
          echo "EXE_NAME=$EXE_NAME" >> $GITHUB_OUTPUT
          echo "EXE_PATH=$EXE_PATH" >> $GITHUB_OUTPUT

      # 6️⃣ Verify artifact exists (important)
      - name: Verify installer exists
        shell: pwsh
        run: |
          if (!(Test-Path "${{ steps.meta.outputs.EXE_PATH }}")) {
            Write-Error "Installer not found!"
            exit 1
          }

      # 7️⃣ Upload to Azure Blob (NO redirect)
      - name: Upload EXE to Azure Blob
        uses: azure/cli@v2
        with:
          inlineScript: |
            az storage blob upload \
              --account-name ${{ secrets.AZURE_STORAGE_ACCOUNT }} \
              --account-key ${{ secrets.AZURE_STORAGE_KEY }} \
              --container-name ${{ secrets.AZURE_CONTAINER_NAME }} \
              --name GemSuite/${{ steps.meta.outputs.VERSION }}/${{ steps.meta.outputs.EXE_NAME }} \
              --file "${{ steps.meta.outputs.EXE_PATH }}" \
              --overwrite true

      # 8️⃣ Output Microsoft Store–ready URL
      - name: Output Store Package URL
        shell: bash
        run: |
          echo "----------------------------------------------"
          echo "Microsoft Store Package URL (NO REDIRECT):"
          echo "https://${{ secrets.AZURE_STORAGE_ACCOUNT }}.blob.core.windows.net/${{ secrets.AZURE_CONTAINER_NAME }}/GemSuite/${{ steps.meta.outputs.VERSION }}/${{ steps.meta.outputs.EXE_NAME }}"
          echo "----------------------------------------------"
