name: Build and Release GemSuite

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v1.0.0

permissions:
  contents: write   # Optional if using a PAT

jobs:
  build:
    name: Build and Release Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout Source Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Electron App
        run: node scripts/dist.js
        env:
          NODE_ENV: production

      - name: List Build Artifacts
        run: dir apps\desktop\release

      - name: Get Version & App Name
        id: get_version
        shell: bash
        run: |
          VERSION=$(node -p "require('./apps/desktop/package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "APP_NAME=GemSuite" >> $GITHUB_OUTPUT

      - name: Upload Release to Binary Repo
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}  # PAT with repo write access
        run: |
          APP_NAME=${{ steps.get_version.outputs.APP_NAME }}
          VERSION=${{ steps.get_version.outputs.VERSION }}
          ARTIFACT="apps/desktop/release/${APP_NAME}-Setup-${VERSION}.exe"
          REPO_B="akash-srivastava-pvt/Apps"

          echo "Creating release v$VERSION in $REPO_B..."
          gh release create "v$VERSION" "$ARTIFACT" \
            --repo "$REPO_B" \
            --title "$APP_NAME v$VERSION" \
            --notes "Automated release from CI"

      - name: Output Download URL
        shell: bash
        run: |
          APP_NAME=${{ steps.get_version.outputs.APP_NAME }}
          VERSION=${{ steps.get_version.outputs.VERSION }}
          REPO_B="akash-srivastava-pvt/Apps"
          echo "--------------------------------------------------"
          echo "Download URL:"
          echo "https://github.com/$REPO_B/releases/download/v$VERSION/${APP_NAME}-Setup-${VERSION}.exe"
          echo "--------------------------------------------------"
