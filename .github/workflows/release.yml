name: Release Gem Suite

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # 🔑 REQUIRED to create GitHub Releases

jobs:
  build:
    name: Build and Release Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Electron App (no publish)
        run: node scripts/dist.js
        env:
          NODE_ENV: production
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # 🔑 electron-builder needs THIS

      - name: Get Version
        id: get_version
        shell: bash
        run: |
          VERSION=$(node -p "require('./apps/desktop/package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "APP_NAME=GemSuite" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            apps/desktop/release/${{ steps.get_version.outputs.APP_NAME }}-${{ steps.get_version.outputs.VERSION }}-x64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Output Package URL
        shell: bash
        run: |
          REPOSITORY="${{ github.repository }}"
          TAG="${{ github.ref_name }}"
          FILENAME="${{ steps.get_version.outputs.APP_NAME }}-${{ steps.get_version.outputs.VERSION }}-x64.exe"
          echo "--------------------------------------------------"
          echo "Microsoft Store Package URL:"
          echo "https://github.com/${REPOSITORY}/releases/download/${TAG}/${FILENAME}"
          echo "--------------------------------------------------"
