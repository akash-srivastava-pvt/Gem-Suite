name: Build and Publish GemSuite (No Redirect)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # needed to push gh-pages

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build Electron App
        run: node scripts/dist.js
        env:
          NODE_ENV: production

      - name: Resolve metadata
        id: meta
        run: |
          VERSION=$(node -p "require('./apps/desktop/package.json').version")
          APP_NAME="GemSuite"
          EXE_NAME="GemSuite Setup $VERSION.exe"
          EXE_PATH="apps/desktop/release/$EXE_NAME"

          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "EXE_NAME=$EXE_NAME" >> $GITHUB_OUTPUT
          echo "EXE_PATH=$EXE_PATH" >> $GITHUB_OUTPUT

      - name: Verify installer
        run: test -f "${{ steps.meta.outputs.EXE_PATH }}"

      - name: Publish to GitHub Pages (NO redirect)
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git fetch origin gh-pages || true
          git checkout gh-pages || git checkout --orphan gh-pages

          mkdir -p GemSuite/${{ steps.meta.outputs.VERSION }}
          cp "${{ steps.meta.outputs.EXE_PATH }}" "GemSuite/${{ steps.meta.outputs.VERSION }}/"

          echo "# GemSuite Downloads" > index.html
          echo "" >> index.html
          echo "- [GemSuite ${{ steps.meta.outputs.VERSION }}](GemSuite/${{ steps.meta.outputs.VERSION }}/${{ steps.meta.outputs.EXE_NAME }})" >> index.html

          git add .
          git commit -m "Release GemSuite ${{ steps.meta.outputs.VERSION }}"
          git push origin gh-pages --force

      - name: Output Microsoft Store URL
        run: |
          echo "--------------------------------------------"
          echo "MICROSOFT STORE PACKAGE URL:"
          echo "https://${{ github.repository_owner }}.github.io/Apps/GemSuite/${{ steps.meta.outputs.VERSION }}/${{ steps.meta.outputs.EXE_NAME }}"
          echo "--------------------------------------------"
