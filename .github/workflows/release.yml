name: Build and Publish GemSuite

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest

    outputs:
      version: ${{ steps.meta.outputs.VERSION }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - run: npm install

      - name: Build EXE
        run: node scripts/dist.js
        env:
          NODE_ENV: production

      - name: Read version
        id: meta
        shell: bash
        run: |
          VERSION=$(node -p "require('./apps/desktop/package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: gemsuite-exe
          path: apps/desktop/release/GemSuite Setup *.exe

  publish-pages:
    name: Publish to GitHub Pages
    runs-on: ubuntu-latest
    needs: build-windows

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: gemsuite-exe
          path: GemSuite/${{ needs.build-windows.outputs.version }}

      - name: Publish gh-pages
        run: |
          git checkout --orphan gh-pages
          git rm -rf .
          git add GemSuite
          git commit -m "Release v${{ needs.build-windows.outputs.version }}"
          git push -f origin gh-pages
