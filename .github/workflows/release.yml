name: Build & Publish GemSuite Installer

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
# ------------------------------------------------------------
# 1️⃣ BUILD WINDOWS INSTALLER
# ------------------------------------------------------------
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest

    outputs:
      version: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install deps
        run: npm install

      - name: Build production installer
        run: node scripts/dist.js
        env:
          NODE_ENV: production

      - name: Read app version
        id: meta
        shell: bash
        run: |
          VERSION=$(node -p "require('./apps/desktop/package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: gemsuite-installer
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/latest.yml

# ------------------------------------------------------------
# 2️⃣ PUBLISH TO GITHUB PAGES (NO REDIRECT URL)
# ------------------------------------------------------------
  publish-pages:
    name: Publish Installer to GitHub Pages
    runs-on: ubuntu-latest
    needs: build-windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: gemsuite-installer
          path: site/GemSuite/${{ needs.build-windows.outputs.version }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Publish gh-pages
        run: |
          git checkout --orphan gh-pages
          git rm -rf .
          mkdir -p GemSuite/${{ needs.build-windows.outputs.version }}
          cp -r site/GemSuite/${{ needs.build-windows.outputs.version }}/* GemSuite/${{ needs.build-windows.outputs.version }}/
          git add GemSuite
          git commit -m "Release v${{ needs.build-windows.outputs.version }}"
          git push -f origin gh-pages

      - name: Output download URL
        run: |
          echo "--------------------------------------------------"
          echo "Direct installer URL (NO redirect):"
          echo "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/GemSuite/${{ needs.build-windows.outputs.version }}/GemSuite%20Setup%20${{ needs.build-windows.outputs.version }}.exe"
          echo "--------------------------------------------------"
