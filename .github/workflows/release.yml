name: Build and Release GemSuite

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Electron App
        run: node scripts/dist.js
        env:
          NODE_ENV: production

      - name: Get Version
        id: get_version
        shell: pwsh
        run: |
          $pkg = Get-Content ./apps/desktop/package.json | ConvertFrom-Json
          $version = $pkg.version
          Write-Output "VERSION=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Output "APP_NAME=GemSuite" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload Release to Binary Repo
        shell: pwsh
        run: |
          $env:GH_TOKEN = "${{ secrets.RELEASE_PAT }}"  # MUST be GH_TOKEN for gh CLI
          $appName = "${{ steps.get_version.outputs.APP_NAME }}"
          $version = "${{ steps.get_version.outputs.VERSION }}"
          $artifactPath = "apps/desktop/release/$appName-$version-x64.exe"
          $repo = "akash-srivastava-pvt/Apps"  # target repo for artifacts

          Write-Host "Creating release v$version in $repo and uploading artifact..."
          gh release create "v$version" $artifactPath --repo $repo --title "$appName v$version" --notes "Automated release from CI"

      - name: Output Download URL
        shell: pwsh
        run: |
          $appName = "${{ steps.get_version.outputs.APP_NAME }}"
          $version = "${{ steps.get_version.outputs.VERSION }}"
          $repo = "akash-srivastava-pvt/Apps"
          Write-Host "--------------------------------------------------"
          Write-Host "Download URL:"
          Write-Host "https://github.com/$repo/releases/download/v$version/$appName-$version-x64.exe"
          Write-Host "--------------------------------------------------"
