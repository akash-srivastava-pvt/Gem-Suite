name: Build, Sign & Publish GemSuite Installer

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
# ------------------------------------------------------------
# 1️⃣ BUILD WINDOWS INSTALLER (UNSIGNED)
# ------------------------------------------------------------
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest

    outputs:
      version: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build production installer
        run: node scripts/dist.js
        env:
          NODE_ENV: production

      - name: Read app version
        id: meta
        shell: bash
        run: |
          VERSION=$(node -p "require('./apps/desktop/package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload unsigned installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: gemsuite-installer-unsigned
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/latest.yml

# ------------------------------------------------------------
# 2️⃣ CODE SIGN WINDOWS INSTALLER
# ------------------------------------------------------------
  sign-windows:
    name: Code Sign Windows Installer
    runs-on: windows-latest
    needs: build-windows

    outputs:
      version: ${{ needs.build-windows.outputs.version }}

    steps:
      - name: Download unsigned installer
        uses: actions/download-artifact@v4
        with:
          name: gemsuite-installer-unsigned
          path: unsigned

      - name: Restore code signing certificate
        shell: powershell
        run: |
          $bytes = [Convert]::FromBase64String("${{ secrets.CODESIGN_PFX_BASE64 }}")
          [IO.File]::WriteAllBytes("codesign.pfx", $bytes)

      - name: Locate signtool.exe
        shell: powershell
        run: |
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" `
            -Recurse -Filter signtool.exe |
            Sort-Object FullName -Descending |
            Select-Object -First 1

          if (-not $signtool) { throw "signtool.exe not found" }
          echo "SIGNTOOL=$($signtool.FullName)" >> $env:GITHUB_ENV
          Write-Host "Using signtool: $($signtool.FullName)"

      - name: Sign EXE
        shell: powershell
        run: |
          $exe = Get-ChildItem unsigned -Recurse -Filter *.exe | Select-Object -First 1
          if (-not $exe) { throw "No EXE found" }
          Write-Host "Signing $($exe.FullName)"
          & "$env:SIGNTOOL" sign `
            /f codesign.pfx `
            /p "${{ secrets.CODESIGN_PASSWORD }}" `
            /fd SHA256 `
            /tr http://timestamp.digicert.com `
            /td SHA256 `
            $exe.FullName

      - name: Verify signature
        shell: powershell
        run: |
          $exe = Get-ChildItem unsigned -Recurse -Filter *.exe | Select-Object -First 1
          $sig = Get-AuthenticodeSignature -FilePath $exe.FullName
          if ($sig.Status -eq "NotSigned") { throw "EXE is NOT signed" }

      - name: Upload signed installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: gemsuite-installer-signed
          path: unsigned

# ------------------------------------------------------------
# 3️⃣ PUBLISH TO GH-PAGES (STORE-SAFE)
# ------------------------------------------------------------
  publish-gh-pages:
    name: Publish Installer to gh-pages
    runs-on: ubuntu-latest
    needs: sign-windows

    steps:
      - name: Checkout Repo B (Apps)
        uses: actions/checkout@v4
        with:
          repository: akash-srivastava-pvt/Apps
          token: ${{ secrets.RELEASE_PAT }}
          path: repo-b
          fetch-depth: 0

      - name: Download signed installer
        uses: actions/download-artifact@v4
        with:
          name: gemsuite-installer-signed
          path: site/GemSuite/${{ needs.sign-windows.outputs.version }}

      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create / update gh-pages branch
        run: |
          cd repo-b
          VERSION=${{ needs.sign-windows.outputs.version }}
          BRANCH="gh-pages"

          # Checkout gh-pages, create if missing
          git fetch origin $BRANCH || true
          git checkout $BRANCH || git checkout --orphan $BRANCH

          # Copy EXE + latest.yml safely
          mkdir -p GemSuite/$VERSION
          rsync -a ../site/GemSuite/$VERSION/ GemSuite/$VERSION/

          git add GemSuite
          git commit -m "GemSuite release v$VERSION" || echo "No changes"
          git push -u origin $BRANCH --force

      - name: Output installer URL
        run: |
          echo "--------------------------------------------------"
          echo "Installer URL (MSFT Store-safe):"
          echo "https://akash-srivastava-pvt.github.io/Apps/GemSuite/${{ needs.sign-windows.outputs.version }}/Gem%20Suite%20Setup%20${{ needs.sign-windows.outputs.version }}.exe"
          echo "--------------------------------------------------"
