name: Build and Release GemSuite

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v1.0.0

permissions:
  contents: write  # Needed if creating releases in source repo (optional here)

jobs:
  build:
    name: Build and Release Windows x64
    runs-on: windows-latest

    steps:
      # 1️⃣ Checkout source repo
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      # 3️⃣ Install dependencies
      - name: Install Dependencies
        run: npm install

      # 4️⃣ Build Electron app
      - name: Build Electron App
        run: node scripts/dist.js
        env:
          NODE_ENV: production

      # 5️⃣ Get version and app name
      - name: Get Version
        id: get_version
        shell: bash
        run: |
          VERSION=$(node -p "require('./apps/desktop/package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "APP_NAME=GemSuite" >> $GITHUB_OUTPUT

      # 6️⃣ Install GitHub CLI
      - name: Install GitHub CLI
        run: |
          choco install gh -y
          gh --version

      # 7️⃣ Create release and upload artifact to Repo B
      - name: Upload Release to Binary Repo
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }} # PAT with write access to Repo B
        shell: pwsh
        run: |
          $appName = "${{ steps.get_version.outputs.APP_NAME }}"
          $version = "${{ steps.get_version.outputs.VERSION }}"
          $artifactPath = "apps/desktop/release/$appName-$version-x64.exe"
          $repoB = "akash-srivastava-pvt/Apps" # Replace with Repo B full name

          Write-Host "Creating release v$version in $repoB and uploading artifact..."
          gh release create "v$version" $artifactPath `
            --repo $repoB `
            --title "$appName v$version" `
            --notes "Automated release from CI"

      # 8️⃣ Output download URL
      - name: Output Download URL
        shell: bash
        run: |
          APP_NAME=${{ steps.get_version.outputs.APP_NAME }}
          VERSION=${{ steps.get_version.outputs.VERSION }}
          REPO="akash-srivastava-pvt/Apps"  # Repo B
          echo "--------------------------------------------------"
          echo "Download URL:"
          echo "https://github.com/$REPO/releases/download/v$VERSION/${APP_NAME}-${VERSION}-x64.exe"
          echo "--------------------------------------------------"
