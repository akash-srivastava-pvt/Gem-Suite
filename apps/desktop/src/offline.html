<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>No Network Connection</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #f5f5f7;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      color: #333;
      text-align: center;
    }

    .container {
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      max-width: 400px;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 16px;
      color: #1d1d1f;
    }

    p {
      color: #86868b;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    button {
      background-color: #0071e3;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 200px;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: #0077ed;
    }

    .icon {
      font-size: 48px;
      margin-bottom: 20px;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="icon">📡</div>
    <h1>No Connection</h1>
    <p>No network available. Please connect to a network and restart the app.</p>
    <button id="retry-btn">Restart App</button>
  </div>
  <script>
    document.getElementById('retry-btn').addEventListener('click', () => {
      if (window.gem && window.gem.restart) {
        window.gem.restart();
      } else {
        window.location.reload();
      }
    });
  </script>
</body>

</html>
