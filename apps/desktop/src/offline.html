<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GemSuite | Connection Required</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #0f172a;
      --card-bg: rgba(255, 255, 255, 0.05);
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg);
      background: radial-gradient(circle at top left, #1e1b4b, #0f172a);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      overflow: hidden;
    }

    .container {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 48px;
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      max-width: 480px;
      text-align: center;
      animation: fadeIn 0.8s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .icon-wrapper {
      position: relative;
      display: inline-block;
      margin-bottom: 32px;
    }

    .icon {
      font-size: 64px;
      filter: drop-shadow(0 0 15px rgba(79, 70, 229, 0.4));
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {

      0%,
      100% {
        transform: scale(1);
        opacity: 1;
      }

      50% {
        transform: scale(1.1);
        opacity: 0.8;
      }
    }

    h1 {
      font-size: 32px;
      font-weight: 600;
      margin: 0 0 16px 0;
      background: linear-gradient(135deg, #fff 0%, #94a3b8 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      color: var(--text-muted);
      font-size: 18px;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    button {
      padding: 14px 28px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      border: none;
      outline: none;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
      box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.2);
    }

    .btn-primary:hover {
      background: var(--primary-hover);
      transform: translateY(-2px);
      box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.4);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(239, 68, 68, 0.1);
      color: #f87171;
      padding: 6px 14px;
      border-radius: 100px;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 24px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: #ef4444;
      border-radius: 50%;
      box-shadow: 0 0 8px #ef4444;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="status-badge">
      <div class="status-dot"></div>
      Offline Mode
    </div>
    <div class="icon-wrapper">
      <div class="icon">📡</div>
    </div>
    <h1>No Network Available</h1>
    <p>Network is required for AI processing and synchronization. Please check your connection to resume full
      functionality.</p>

    <div class="actions">
      <button class="btn-primary" id="retry-btn">Try Reconnect</button>
      <button class="btn-secondary" id="local-btn">Continue to Local Features</button>
    </div>
  </div>

  <script>
    const retryBtn = document.getElementById('retry-btn');
    const localBtn = document.getElementById('local-btn');

    retryBtn.addEventListener('click', async () => {
      retryBtn.innerText = 'Checking...';
      retryBtn.disabled = true;

      const isOnline = await window.gem.checkNetwork();
      if (isOnline) {
        window.gem.restart();
      } else {
        setTimeout(() => {
          retryBtn.innerText = 'Try Reconnect';
          retryBtn.disabled = false;
        }, 1000);
      }
    });

    localBtn.addEventListener('click', () => {
      window.gem.continueToLocal();
    });

    // Auto-check every 5 seconds
    setInterval(async () => {
      const isOnline = await window.gem.checkNetwork();
      if (isOnline) {
        window.gem.restart();
      }
    }, 5000);
  </script>
</body>

</html>
